<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil de negocio</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary-color: #111;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
        }

        .card {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .info {
            margin: 15px 0;
            line-height: 1.6;
        }

        .button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border-radius: 12px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1 id="name">Cargando...</h1>

        <p id="description" class="description"></p>

        <div class="info">
            <p id="category"></p>
            <p id="address"></p>
            <p id="phone"></p>
            <p id="hours"></p>
        </div>

        <a id="whatsapp" class="button hidden" target="_blank">
            WhatsApp
        </a>

        <a id="instagram" class="button hidden" target="_blank">
            Instagram
        </a>

        <a id="maps" class="button hidden" target="_blank">
            📍 Cómo llegar
        </a>

        <a id="website" class="button hidden" target="_blank">
            🌐 Sitio web
        </a>

    </div>
</div>

<script>

const SUPABASE_URL = "https://ktguetjvnhcylybxfjto.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_jh7Ytp-pUWZvI9isV_-Sbg_aTbY4Qfq";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// Detectar automáticamente el slug desde la URL

const pathParts = window.location.pathname
    .split("/")
    .filter(Boolean);

const pIndex = pathParts.indexOf("p");

const slug = pIndex !== -1
    ? pathParts[pIndex + 1]
    : null;


// Buscar negocio en Supabase

const { data, error } = await supabaseClient
    .from("businesses")
    .select("*")
    .eq("slug", slug)
    .eq("is_published", true)
    .single();


if (error || !data) {

    document.getElementById("name").textContent =
        "Negocio no encontrado";

} else {

    document.title = data.name || "Perfil de negocio";

    document.getElementById("name").textContent =
        data.name || "";

    document.getElementById("description").textContent =
        data.description || "";

    document.getElementById("category").textContent =
        data.category || "";

    document.getElementById("address").textContent =
        data.address || "";

    document.getElementById("phone").textContent =
        data.phone || "";

    document.getElementById("hours").textContent =
        data.opening_hours || "";


    document.documentElement.style.setProperty(
        "--primary-color",
        data.primary_color || "#111111"
    );


    if (data.whatsapp) {

        const whatsapp = document.getElementById("whatsapp");

        whatsapp.href =
            "https://wa.me/" + data.whatsapp;

        whatsapp.classList.remove("hidden");
    }


    if (data.instagram) {

        const instagram = document.getElementById("instagram");

        instagram.href = data.instagram;

        instagram.classList.remove("hidden");
    }


    if (data.maps_url) {

        const maps = document.getElementById("maps");

        maps.href = data.maps_url;

        maps.classList.remove("hidden");
    }


    if (data.website) {

        const website = document.getElementById("website");

        website.href = data.website;

        website.classList.remove("hidden");
    }
}

</script>

</body>
</html>
