<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barbería Central</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
            font-size: 30px;
        }

        .description {
            color: #bbb;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border-radius: 12px;
            background: #222;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #333;
        }

        #loading {
            color: #aaa;
            margin-top: 40px;
        }

        #error {
            color: #ff6b6b;
            margin-top: 40px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div id="loading">
        Cargando perfil...
    </div>

    <div id="error">
        No se pudo cargar el perfil.
    </div>

    <div id="profile" style="display:none;">

        <img id="logo" class="logo" src="" alt="Logo">

        <h1 id="name"></h1>

        <p id="description" class="description"></p>

        <a id="whatsapp" class="button" target="_blank">
            WhatsApp
        </a>

        <a id="instagram" class="button" target="_blank">
            Instagram
        </a>

        <a id="maps" class="button" target="_blank">
            📍 Cómo llegar
        </a>

        <a id="website" class="button" target="_blank">
            🌐 Sitio web
        </a>

    </div>

</div>

<script>

    const SUPABASE_URL = "https://ktguetjvnhcylybxfjto.supabase.co";

    // IMPORTANTE:
    // Aquí colocaremos la clave pública de Supabase
    // en el siguiente paso.
    const SUPABASE_ANON_KEY = "sb_publishable_jh7Ytp-pUWZvI9isV_-Sbg_aTbY4Qfq";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    async function loadBusiness() {

        const { data, error } = await supabaseClient
            .from("businesses")
            .select("*")
            .eq("slug", "barberia-central")
            .single();

        if (error) {
            console.error(error);

            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "block";

            return;
        }

        document.getElementById("loading").style.display = "none";
        document.getElementById("profile").style.display = "block";

        document.getElementById("name").textContent = data.name;
        document.getElementById("description").textContent = data.description || "";

        if (data.logo_url) {
            document.getElementById("logo").src = data.logo_url;
        } else {
            document.getElementById("logo").style.display = "none";
        }

        if (data.whatsapp) {
            document.getElementById("whatsapp").href =
                "https://wa.me/" + data.whatsapp;
        } else {
            document.getElementById("whatsapp").style.display = "none";
        }

        if (data.instagram) {
            document.getElementById("instagram").href = data.instagram;
        } else {
            document.getElementById("instagram").style.display = "none";
        }

        if (data.maps_url) {
            document.getElementById("maps").href = data.maps_url;
        } else {
            document.getElementById("maps").style.display = "none";
        }

        if (data.website) {
            document.getElementById("website").href = data.website;
        } else {
            document.getElementById("website").style.display = "none";
        }
    }

    loadBusiness();

</script>

</body>
</html>
