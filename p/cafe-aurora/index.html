<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Café Aurora</title>

    <meta name="description"
          content="Café Aurora - Café, pastelería y buenos momentos.">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 35px 20px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #22222a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-size: 40px;
        }

        h1 {
            font-size: 32px;
            margin-top: 15px;
        }

        .description {
            color: #aaaab5;
            margin: 12px 0 30px;
            line-height: 1.5;
        }

        .button {
            display: block;
            padding: 17px;
            margin: 14px 0;
            background: #19191f;
            border: 1px solid #30303a;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #25252e;
        }

        .whatsapp {
            background: #25D366;
            border: none;
        }

        .menu {
            background: #6c63ff;
            border: none;
        }

        .footer {
            margin-top: 35px;
            color: #666;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        ☕
    </div>

    <h1>Café Aurora</h1>

    <p class="description">
        Café de especialidad, pastelería y buenos momentos.
        Ven a conocernos.
    </p>

    <a class="button whatsapp"
       href="https://wa.me/56912345678"
       target="_blank">
        💬 Contactar por WhatsApp
    </a>

    <a class="button menu"
       href="#"
       target="_blank">
        📋 Ver menú
    </a>

    <a class="button"
       href="https://instagram.com/"
       target="_blank">
        📸 Instagram
    </a>

    <a class="button"
       href="https://maps.google.com/"
       target="_blank">
        📍 Cómo llegar
    </a>

    <a class="button"
       href="#"
       target="_blank">
        ⭐ Dejar una reseña
    </a>

    <div class="footer">
        Perfil digital creado por QRNFC Business
    </div>

</div>

</body>

</html>
