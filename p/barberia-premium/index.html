<!DOCTYPE html>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
* {
    box-sizing: border-box;
}

:root {
    --primary-color: #111111;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

.logo {

<body>

<div class="container">
    <div class="card">
<img id="logo" class="logo hidden" alt="Logo del negocio">
        <h1 id="name">Cargando...</h1>

        <p id="description" class="description"></p>

        <div class="info">
            <p id="category"></p>
            <p id="address"></p>
            <p id="phone"></p>
            <p id="hours"></p>
        </div>

        <a id="whatsapp" class="button hidden" target="_blank">
    💬 Contactar por WhatsApp
</a>
<a id="call" class="button hidden">
    📞 Llamar ahora
</a>
        <a id="instagram" class="button hidden" target="_blank">
            Instagram
        </a>

        <a id="maps" class="button hidden" target="_blank">
    📍 Cómo llegar
</a>

        <a id="website" class="button hidden" target="_blank">
            🌐 Sitio web
        </a>

    </div>
</div>

<script>

const SUPABASE_URL =
    "https://ktguetjvnhcylybxfjto.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_jh7Ytp-pUWZvI9isV_-Sbg_aTbY4Qfq";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// Detectar automáticamente el slug desde la URL

const pathParts = window.location.pathname
    .split("/")
    .filter(Boolean);


// Buscar la última parte de la URL

const slug = pathParts[pathParts.length - 1];


// Buscar el negocio en Supabase

async function loadBusiness() {

    const { data, error } = await supabaseClient
        .from("businesses")
        .select("*")
        .eq("slug", slug)
        .eq("is_published", true)
        .single();


    if (error || !data) {

        document.getElementById("name").textContent =
            "Negocio no encontrado";

        console.error("Error:", error);

        return;
    }  

// Logo

if (data.logo_url) {

    const logo =
        document.getElementById("logo");

    logo.src =
        data.logo_url;

    logo.classList.remove("hidden");
}

    // Título de la página

    document.title =
        data.name || "Perfil de negocio";


    // Información principal

    document.getElementById("name").textContent =
        data.name || "";

    document.getElementById("description").textContent =
        data.description || "";

    document.getElementById("category").textContent =
        data.category || "";

    document.getElementById("address").textContent =
        data.address || "";

    document.getElementById("phone").textContent =
        data.phone || "";

    document.getElementById("hours").textContent =
        data.opening_hours || "";


    // Color principal

    document.documentElement.style.setProperty(
        "--primary-color",
        data.primary_color || "#111111"
    );


    // WhatsApp

    if (data.whatsapp) {

        const whatsapp =
            document.getElementById("whatsapp");

        whatsapp.href =
    "https://wa.me/" + data.whatsapp +
    "?text=" + encodeURIComponent(
        "Hola, vi su perfil y me gustaría obtener más información."
    );

        whatsapp.classList.remove("hidden");
    }
// Llamar

if (data.phone) {

    const call =
        document.getElementById("call");

    call.href =
        "tel:" + data.phone.replace(/\s/g, "");

    call.classList.remove("hidden");
}

    // Instagram

    if (data.instagram) {

        const instagram =
            document.getElementById("instagram");

        instagram.href =
            data.instagram;

        instagram.classList.remove("hidden");
    }


    // Google Maps

    if (data.maps_url) {

        const maps =
            document.getElementById("maps");

        maps.href =
            data.maps_url;

        maps.classList.remove("hidden");
    }


    // Sitio web

    if (data.website) {

        const website =
            document.getElementById("website");

        website.href =
            data.website;

        website.classList.remove("hidden");
    }

}


// Ejecutar

loadBusiness();

</script>

</body>
</html>
